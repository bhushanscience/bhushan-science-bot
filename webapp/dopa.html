<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><title>DOPA: Neon Rush 3D</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#101b2b;color:#fff;font-family:system-ui;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:7px;pointer-events:none}.panel{flex:1;padding:7px 10px;background:#081522c9;border:1px solid #8beaff55;border-radius:12px;box-shadow:0 3px 18px #0005}.panel small{display:block;font-size:9px;color:#9fc9dc;letter-spacing:.15em;font-weight:900}.panel b{font-size:clamp(16px,4vw,23px);font-variant-numeric:tabular-nums}.right{text-align:right}#nitroOuter{position:absolute;top:82px;left:12px;right:12px;height:9px;background:#18253b;border:1px solid #ffffff33;border-radius:9px;overflow:hidden}#nitroBar{height:100%;width:100%;background:linear-gradient(90deg,#00eaff,#b34dff);box-shadow:0 0 14px #00eaff}#message{position:absolute;top:31%;left:7%;right:7%;text-align:center;text-shadow:0 3px 20px #000}#message .sub{font-size:10px;letter-spacing:.24em;color:#73f2ff;font-weight:900}h1{font-size:clamp(34px,10vw,60px);margin:4px 0;font-style:italic;letter-spacing:.05em}#desc{font-size:13px;color:#d4e8f3;margin:6px auto;max-width:340px}button{font-family:inherit;touch-action:none}#start{border:0;border-radius:30px;padding:14px 30px;margin-top:14px;background:linear-gradient(100deg,#00eaff,#b44bff);color:#05101a;font-weight:1000;letter-spacing:.13em;box-shadow:0 0 25px #00d9ff66;pointer-events:auto}#actions{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}.steer{display:flex;gap:10px;pointer-events:auto}.ctl{width:clamp(62px,17vw,82px);height:clamp(62px,17vw,82px);border-radius:50%;background:#06182bd9;border:1px solid #8ceeff99;color:#e9fbff;font-size:26px;font-weight:900;box-shadow:inset 0 0 16px #00cfff22,0 0 14px #00dfff22}.ctl.active{background:#00cfff66;transform:scale(.96)}#boost{border-color:#e69aff;background:#37134bd9;font-size:11px;letter-spacing:.1em}#hint{position:absolute;bottom:108px;left:0;right:0;text-align:center;color:#d5efff99;font-size:9px;letter-spacing:.13em;pointer-events:none}@media(min-width:700px){#actions{padding:0 7vw}}
</style></head><body>
<canvas id="scene"></canvas><div class="hud"><div class="panel"><small>DISTANCE</small><b id="dist">0 m</b></div><div class="panel"><small>BEST RUN</small><b id="best">0 m</b></div><div class="panel right"><small>SPEED</small><b id="speed">0 km/h</b></div></div><div id="nitroOuter"><div id="nitroBar"></div></div>
<div id="message"><div class="sub">DOPA ARCADE • OPEN ROAD</div><h1 id="headline">NEON RUSH</h1><p id="desc">Race through scenic hills. Dodge rivals. Hit the nitro.</p><button id="start">START RACE</button></div>
<div id="hint">◀ ▶ STEER • HOLD BOOST FOR NITRO • SWIPE TO MOVE</div><div id="actions"><div class="steer"><button class="ctl" id="left">◀</button><button class="ctl" id="right">▶</button></div><button class="ctl" id="boost">NITRO<br>⚡</button></div>
<script>
(()=>{const cv=document.querySelector('canvas'),c=cv.getContext('2d'),$=id=>document.getElementById(id);let w,h,dpr,active=false,t0=0,roadMove=0,dist=0,v=0,nitro=100,steer=0,boost=false,shake=0,traffic=[],sparks=[],playerX=0,best=+(localStorage.getItem('dopa_rush_best')||0);$('best').textContent=best+' m';
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';c.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),mix=(a,b,t)=>a+(b-a)*t;
function roadAt(y){let horizon=h*.29,t=clamp((y-horizon)/(h-horizon),0,1),half=mix(w*.07,w*.47,t);return {cx:w*.5+Math.sin(roadMove*.0005)*w*.035*(1-t),half,t}}
function sky(){let g=c.createLinearGradient(0,0,0,h*.48);g.addColorStop(0,'#54b9ee');g.addColorStop(.65,'#a9e6f4');g.addColorStop(1,'#e8f6ee');c.fillStyle=g;c.fillRect(0,0,w,h);c.fillStyle='#fff7c6';c.beginPath();c.arc(w*.78,h*.12,Math.min(w,h)*.045,0,Math.PI*2);c.fill();c.fillStyle='#d0e9ed';for(let i=0;i<5;i++){let x=((i*w*.27-roadMove*.018)%(w*1.4)+w*1.4)%(w*1.4)-w*.15,y=h*.12+(i%3)*h*.045;c.beginPath();c.ellipse(x,y,30+i*7,8+i*2,0,0,Math.PI*2);c.fill()}
c.fillStyle='#7cae8c';c.beginPath();c.moveTo(0,h*.3);for(let x=0;x<=w;x+=w/8)c.lineTo(x,h*.22+Math.sin(x*.013+roadMove*.0002)*h*.06);c.lineTo(w,h*.45);c.lineTo(0,h*.45);c.fill();c.fillStyle='#54825e';c.beginPath();c.moveTo(0,h*.38);for(let x=0;x<=w;x+=w/10)c.lineTo(x,h*.31+Math.sin(x*.02+2)*h*.07);c.lineTo(w,h*.55);c.lineTo(0,h*.55);c.fill()}
function tree(x,y,s){c.save();c.translate(x,y);c.fillStyle='#73533b';c.fillRect(-s*.07,-s*.5,s*.14,s*.5);c.fillStyle='#286c43';for(let k=0;k<3;k++){c.beginPath();c.moveTo(0,-s*(.95-k*.2));c.lineTo(-s*(.38-k*.06),-s*(.42-k*.16));c.lineTo(s*(.38-k*.06),-s*(.42-k*.16));c.closePath();c.fill()}c.fillStyle='#4a9b57';c.beginPath();c.arc(-s*.13,-s*.65,s*.16,0,Math.PI*2);c.fill();c.restore()}
function groundRoad(){sky();c.fillStyle='#7ab66c';c.fillRect(0,h*.29,w,h*.71);for(let y=h*.29;y<h;y+=3){let r=roadAt(y);c.fillStyle='#4c555b';c.fillRect(r.cx-r.half,y,r.half*2,4);c.fillStyle='#e8e4d3';c.fillRect(r.cx-r.half-4,y,4,4);c.fillRect(r.cx+r.half,y,4,4)}
for(let lane=1;lane<3;lane++){for(let i=0;i<14;i++){let z=((i/14+roadMove*.0011)%1),y=mix(h*.29,h,z*z),r=roadAt(y),x=r.cx-r.half+r.half*2*lane/3;c.fillStyle='#f6f4d7';c.fillRect(x-1,y,2+z*2,4+z*17)}}
for(let i=0;i<18;i++){let z=((i/18+roadMove*.00065)%1),y=mix(h*.31,h*.92,z*z),r=roadAt(y),s=8+z*48,side=i%2?-1:1,x=r.cx+side*(r.half+s*.6+mix(8,w*.13,z));tree(x,y,s)}}
function car(x,y,scale,color,player=false){c.save();c.translate(x,y);c.scale(scale,scale);c.shadowColor=color;c.shadowBlur=player?15:5;c.fillStyle=color;c.beginPath();c.moveTo(-29,22);c.lineTo(-35,3);c.lineTo(-26,-25);c.lineTo(-15,-37);c.lineTo(15,-37);c.lineTo(27,-23);c.lineTo(35,4);c.lineTo(29,22);c.closePath();c.fill();c.shadowBlur=0;c.fillStyle='#172b3c';c.beginPath();c.moveTo(-21,-14);c.lineTo(-13,-31);c.lineTo(13,-31);c.lineTo(21,-14);c.lineTo(17,0);c.lineTo(-17,0);c.closePath();c.fill();c.fillStyle='#5eeaff';c.globalAlpha=.6;c.fillRect(-18,-12,36,3);c.globalAlpha=1;c.fillStyle='#11141c';c.fillRect(-36,-17,8,22);c.fillRect(28,-17,8,22);c.fillRect(-31,13,8,14);c.fillRect(23,13,8,14);c.fillStyle='#fff2c4';c.fillRect(-25,12,8,5);c.fillRect(17,12,8,5);c.fillStyle='#ff325e';c.fillRect(-24,23,9,4);c.fillRect(15,23,9,4);
if(player){c.fillStyle='#17202d';c.beginPath();c.ellipse(0,-19,11,15,0,0,Math.PI*2);c.fill();c.fillStyle='#f0c79a';c.beginPath();c.arc(0,-24,8,0,Math.PI*2);c.fill();c.fillStyle='#f6d43a';c.beginPath();c.arc(0,-26,9,Math.PI,Math.PI*2);c.fill();c.fillStyle='#172c40';c.fillRect(-7,-22,14,4);c.fillStyle='#f7c72e';c.fillRect(-3,-8,6,13);c.fillStyle='#ffef78';c.fillRect(-34,1,68,3)}c.restore()}
function spawnRival(){traffic.push({lane:Math.floor(Math.random()*3),z:.08+Math.random()*.2,color:['#ef3867','#22dc9b','#8c67ff','#ffbd35','#13c8ed'][Math.floor(Math.random()*5)],speed:.3+Math.random()*.35})}
function rivalDraw(o){let y=mix(h*.31,h*.76,o.z*o.z),r=roadAt(y),x=r.cx-r.half+r.half*(o.lane+.5)/3,sc=.25+o.z*1.2;car(x,y,sc,o.color,false);o.x=x;o.y=y}
function update(dt){if(!active)return;let f=dt/16.67;v=mix(v,boost&&nitro>0?10:6.2,.035*f);dist+=v*f*.11;roadMove+=v*f*2.3;nitro=clamp(nitro+(boost&&nitro>0?-.7:.16)*f,0,100);playerX=clamp(playerX+steer*.009*f,-.92,.92);if(Math.random()<.018*f+dist*.000005)spawnRival();for(let o of traffic)o.z+=(v*.0007+o.speed*.0011)*f;traffic=traffic.filter(o=>o.z<1.12);for(let o of traffic){let y=mix(h*.31,h*.76,o.z*o.z),r=roadAt(y),x=r.cx-r.half+r.half*(o.lane+.5)/3,px=roadAt(h*.79).cx+playerX*roadAt(h*.79).half*.82;if(o.z>.68&&o.z<.94&&Math.abs(x-px)<(28+o.z*45)){crash();break}}$('dist').textContent=Math.floor(dist)+' m';$('speed').textContent=Math.floor(v*26)+' km/h';$('nitroBar').style.width=nitro+'%';for(let p of sparks){p.x+=p.vx*f;p.y+=p.vy*f;p.life-=f}sparks=sparks.filter(p=>p.life>0);shake=Math.max(0,shake-f*.65)}
function crash(){active=false;shake=15;for(let i=0;i<35;i++)sparks.push({x:w/2,y:h*.8,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:24+Math.random()*30,color:['#ff4269','#ffdd52','#4cecff'][i%3]});if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.setItem('dopa_rush_best',best);$('best').textContent=best+' m'}$('headline').textContent='RACE OVER';$('desc').textContent='You raced '+Math.floor(dist)+' m • Personal best '+best+' m';$('start').textContent='RACE AGAIN';$('message').style.display='block'}
function render(){c.save();if(shake)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);groundRoad();traffic.sort((a,b)=>a.z-b.z);for(let o of traffic)rivalDraw(o);let r=roadAt(h*.8),px=r.cx+playerX*r.half*.82;car(px,h*.84,1.35,boost?'#b84dff':'#ffbf25',true);if(boost){for(let i=0;i<5;i++){c.fillStyle=i%2?'#ff7c34aa':'#d85dff99';c.beginPath();c.moveTo(px-22+i*10,h*.88);c.lineTo(px-18+i*10,h*.88+20+Math.random()*25);c.lineTo(px-12+i*10,h*.88);c.fill()}}for(let p of sparks){c.globalAlpha=clamp(p.life/20,0,1);c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,2+Math.random()*3,0,Math.PI*2);c.fill()}c.globalAlpha=1;c.restore();requestAnimationFrame(frame)}
function frame(t){let dt=Math.min(40,t-t0||16);t0=t;update(dt);render()}
function start(){active=true;dist=0;v=0;nitro=100;roadMove=0;traffic=[];sparks=[];playerX=0;steer=0;boost=false;$('message').style.display='none'}
$('start').addEventListener('click',start);
function hold(id,val){let e=$(id),down=ev=>{ev.preventDefault();steer=val;e.classList.add('active')},up=ev=>{ev.preventDefault();if(steer===val)steer=0;e.classList.remove('active')};e.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(k=>e.addEventListener(k,up))}
hold('left',-1);hold('right',1);$('boost').addEventListener('pointerdown',e=>{e.preventDefault();boost=true;$('boost').classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(k=>$('boost').addEventListener(k,()=>{boost=false;$('boost').classList.remove('active')}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key===' '||e.key==='Shift')boost=true;if(e.key==='Enter'&&!active)start()});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steer=0;if(e.key===' '||e.key==='Shift')boost=false});
let sx=null;cv.addEventListener('pointerdown',e=>{if(active)sx=e.clientX});cv.addEventListener('pointermove',e=>{if(active&&sx!==null){playerX=clamp(playerX+(e.clientX-sx)/w*2,-.92,.92);sx=e.clientX}});cv.addEventListener('pointerup',()=>sx=null);cv.addEventListener('pointercancel',()=>sx=null);requestAnimationFrame(frame);
})();
</script></body></html>

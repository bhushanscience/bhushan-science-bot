<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07000f"><title>DOPA ✦ Tap the Spark</title>
<style>
*{box-sizing:border-box;user-select:none;touch-action:manipulation}html,body{margin:0;height:100%;overflow:hidden;background:#07000f;color:#fff;font-family:system-ui}body{background:radial-gradient(circle at 50% 30%,#1b0033,#07000f 65%)}body.fever{background:radial-gradient(circle at 50% 30%,#3d0a4d,#0a0016 65%)}#app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}header,footer{display:flex;gap:8px}.stat{flex:1;background:#ffffff0d;border:1px solid #ffffff18;border-radius:14px;padding:8px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:9px;letter-spacing:.14em;opacity:.5}#xpwrap,#feverwrap{height:7px;border-radius:8px;background:#ffffff14;overflow:hidden;position:relative}#xpbar,#feverbar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a855f7)}#feverwrap{height:22px;display:grid;place-items:center}#feverbar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f472b6,#fbbf24)}#feverlabel{z-index:1;font-size:9px;letter-spacing:.2em}main{flex:1;display:grid;place-items:center;position:relative}#orb{width:min(64vw,270px);aspect-ratio:1;border:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff,#7dd3fc 22%,#a855f7 58%,#3b0764);box-shadow:0 0 70px #a855f7aa,inset 0 0 40px #ffffff55;animation:breathe 2.4s infinite}#orb:active{transform:scale(.93)}@keyframes breathe{50%{box-shadow:0 0 130px #c084fc,inset 0 0 60px #fff9}}#orbicon{font-size:60px}#hint{position:absolute;bottom:0;font-size:10px;letter-spacing:.3em;opacity:.4}footer button{flex:1;padding:13px 6px;border-radius:14px;border:1px solid #ffffff20;background:#ffffff0d;color:white;font-weight:700}#daily.ready{border-color:#fbbf24}#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-140%);z-index:9;padding:11px 18px;border-radius:999px;background:#fff;color:#12001f;font-weight:800;transition:.3s;white-space:nowrap}#toast.show{transform:translate(-50%,0)}#modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000b;padding:22px}#modal.hidden{display:none}.card{max-width:330px;width:100%;text-align:center;padding:26px 20px;border-radius:24px;background:linear-gradient(160deg,#2a0845,#0d0018);border:1px solid #a855f766}.card button{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#22d3ee,#a855f7);color:white;font-weight:800}
</style></head><body><div id="app"><header><div class="stat"><b id="score">0</b><span>SPARKS</span></div><div class="stat"><b id="combo">1x</b><span>COMBO</span></div><div class="stat"><b id="lvl">1</b><span>LEVEL</span></div></header><div id="xpwrap"><div id="xpbar"></div></div><main><button id="orb" aria-label="Tap the spark"><span id="orbicon">✦</span></button><div id="hint">TAP THE SPARK</div></main><div id="feverwrap"><div id="feverbar"></div><span id="feverlabel">FEVER</span></div><footer><button id="share">📣 Brag</button><button id="sound">🔊</button><button id="daily">🎁 Daily</button><button id="back">↩ Back</button></footer></div><canvas id="fx" style="position:fixed;inset:0;pointer-events:none"></canvas><div id="toast"></div><div id="modal" class="hidden"><div class="card"><h2 id="mtitle">Daily Chest</h2><p id="mtext"></p><button id="mbtn">CLAIM</button></div></div>
<script>
const $=s=>document.querySelector(s);const cv=$("#fx"),ctx=cv.getContext("2d");let W,H,parts=[];function rs(){let d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0)}rs();addEventListener("resize",rs);
const DEF={score:0,best:0,xp:0,level:1,taps:0,dayStreak:0,lastDay:"",sound:true,ach:[]};let state=Object.assign({},DEF,JSON.parse(localStorage.getItem("dopa")||"{}"));let combo=0,mult=1,lastTap=0,fever=0,feverUntil=0,AC;
const save=()=>localStorage.setItem("dopa",JSON.stringify(state));function beep(f,d=.08){if(!state.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toast(m){let e=$("#toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}function upd(){$("#score").textContent=state.score.toLocaleString();$("#combo").textContent=mult+"x";$("#lvl").textContent=state.level;$("#xpbar").style.width=Math.min(100,state.xp/(state.level*300)*100)+"%";$("#daily").classList.toggle("ready",state.lastDay!==new Date().toDateString());$("#sound").textContent=state.sound?"🔊":"🔇"}
function burst(x,y,n,col){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=Math.random()*7+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,dec:.015+Math.random()*.02,r:2+Math.random()*3,c:col[i%col.length]})}}
function tap(e){e.preventDefault();let now=Date.now();combo=now-lastTap<1500?combo+1:1;lastTap=now;mult=1+Math.floor(combo/4);let r=Math.random(),v=r<.015?500:r<.06?150:r<.2?50:r<.55?20:10,gain=Math.round(v*mult*(now<feverUntil?3:1));state.score+=gain;state.taps++;state.xp+=Math.max(1,Math.round(gain/5));state.best=Math.max(state.best,state.score);while(state.xp>=state.level*300){state.xp-=state.level*300;state.level++;toast("🎉 LEVEL "+state.level+"!")}if(now>=feverUntil){fever=Math.min(100,fever+3+combo*1.5);if(fever>=100){fever=0;feverUntil=now+10000;toast("⚡ FEVER — 3× SPARKS!")}}let rct=$("#orb").getBoundingClientRect();burst(rct.left+rct.width/2,rct.top+rct.height/2,v===500?80:15+Math.min(combo*2,26),["#22d3ee","#fff","#a855f7","#fbbf24"]);if(v>=50)toast((v===500?"⚡ LEGENDARY":v===150?"💜 EPIC":"💠 RARE")+" +"+gain);beep(300+Math.min(combo,24)*45);if(navigator.vibrate)navigator.vibrate(8);save();upd()}
function loop(){let now=Date.now();if(combo&&now-lastTap>1500){combo=0;mult=1;upd()}let inF=now<feverUntil;document.body.classList.toggle("fever",inF);$("#feverbar").style.width=(inF?(feverUntil-now)/10000*100:fever)+"%";ctx.clearRect(0,0,W,H);for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.life-=p.dec;if(p.life<=0||p.y>H+50){parts.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(loop)}
function daily(){let t=new Date().toDateString();if(state.lastDay===t){toast("Come back tomorrow ✦");return}let reward=[200,500,1000,2500][Math.floor(Math.random()*4)];$("#mtitle").textContent="Daily Chest 🔥";$("#mtext").textContent="Streak "+(state.dayStreak+1)+" • claim "+reward+" sparks";$("#mbtn").textContent="CLAIM";$("#mbtn").onclick=()=>{state.dayStreak++;state.lastDay=t;state.score+=reward;state.xp+=Math.round(reward/5);while(state.xp>=state.level*300){state.xp-=state.level*300;state.level++}save();upd();$("#mtitle").textContent="🎁 Reward!";$("#mtext").textContent="+"+reward.toLocaleString()+" SPARKS";$("#mbtn").textContent="CONTINUE";$("#mbtn").onclick=()=>$("#modal").classList.add("hidden");burst(W/2,H/2,100,["#fbbf24","#22d3ee","#c084fc","#fff"])};$("#modal").classList.remove("hidden")}
$("#orb").addEventListener("pointerdown",tap);$("#sound").onclick=()=>{state.sound=!state.sound;save();upd();beep(500)};$("#daily").onclick=daily;$("#back").onclick=()=>history.back();$("#share").onclick=async()=>{let txt="I'm at "+state.score.toLocaleString()+" sparks, level "+state.level+" on DOPA ✦ Beat me!";try{if(navigator.share)await navigator.share({title:"DOPA",text:txt});else{await navigator.clipboard.writeText(txt);toast("Copied 📣")}}catch(e){toast("Share cancelled")}};$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")};upd();loop();if(state.lastDay!==new Date().toDateString())setTimeout(()=>toast("🎁 Daily chest ready!"),800);
</script></body></html>

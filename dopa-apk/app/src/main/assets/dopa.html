<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050914">
<title>DOPA: Neon Rush</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;pointer-events:none}.panel{background:#071323d9;border:1px solid #56d8ff55;border-radius:12px;padding:7px 11px;min-width:0;flex:1;box-shadow:0 0 15px #00c8ff12}.panel small{display:block;color:#8bb8d1;font-size:9px;letter-spacing:.16em;font-weight:800}.panel b{font-size:clamp(16px,4vw,23px);font-variant-numeric:tabular-nums}.right{text-align:right}#nitroOuter{position:absolute;top:82px;left:12px;right:12px;height:8px;background:#15233b;border-radius:10px;overflow:hidden;border:1px solid #42618466}#nitroBar{height:100%;width:100%;background:linear-gradient(90deg,#00e5ff,#ad4dff);box-shadow:0 0 12px #00d9ff}#message{position:absolute;top:34%;left:8%;right:8%;text-align:center;text-shadow:0 4px 25px #000;pointer-events:none}#message h1{margin:0;font-size:clamp(32px,9vw,56px);letter-spacing:.06em;font-style:italic;color:#fff}#message p{margin:8px auto;color:#b8d7ed;font-size:14px;max-width:320px}#message .sub{font-size:11px;color:#6eeaff;letter-spacing:.18em;font-weight:900}#actions{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.steer{display:flex;gap:12px;pointer-events:auto}.control{width:clamp(64px,17vw,82px);height:clamp(64px,17vw,82px);border-radius:50%;border:1px solid #7eeaff99;background:#07182ac9;color:#dffaff;font-size:28px;font-weight:900;box-shadow:inset 0 0 20px #00bfff22,0 0 18px #00d9ff18;touch-action:none}.control:active,.control.active{background:#00bce655;transform:scale(.96)}#nitro{width:76px;height:76px;border-color:#dc79ff;background:#351047d9;color:#ffdbff;font-size:12px;letter-spacing:.1em}#nitro:active{background:#b832f877}#startBtn{pointer-events:auto;border:0;border-radius:28px;padding:14px 30px;margin-top:18px;background:linear-gradient(90deg,#00d5ff,#a34dff);color:#04101b;font-weight:1000;letter-spacing:.12em;font-size:14px;box-shadow:0 0 25px #00cfff55}#startBtn.hidden{display:none}#hint{position:absolute;bottom:120px;left:0;right:0;text-align:center;color:#a6c5db77;font-size:10px;letter-spacing:.1em;pointer-events:none}@media(min-width:700px){#actions{padding:0 7vw}.control{width:84px;height:84px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel"><small>DISTANCE</small><b id="distance">0 m</b></div><div class="panel"><small>BEST RUN</small><b id="best">0 m</b></div><div class="panel right"><small>SPEED</small><b id="speed">0 km/h</b></div></div>
<div id="nitroOuter"><div id="nitroBar"></div></div>
<div id="message"><div class="sub">DOPA ARCADE SERIES</div><h1 id="headline">NEON RUSH</h1><p id="desc">Dodge traffic. Build speed. Own the highway.</p><button id="startBtn">START RACE</button></div>
<div id="hint">STEER THROUGH TRAFFIC • HOLD NITRO TO BOOST</div>
<div id="actions"><div class="steer"><button class="control" id="left" aria-label="Steer left">◀</button><button class="control" id="right" aria-label="Steer right">▶</button></div><button class="control" id="nitro">NITRO<br>⚡</button></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,playing=false,over=false,last=0,roadOffset=0,spawn=0,dist=0,speed=0,nitro=100,steer=0,boost=false,shake=0,flash=0,traffic=[],particles=[],lane=1;
let best=Number(localStorage.getItem('dopa_rush_best')||0);$('best').textContent=best+' m';
const player={x:0,y:0,w:34,h:62};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.77;player.x=W/2;}
addEventListener('resize',resize);resize();
function road(){let rw=Math.min(W*.78,480),left=(W-rw)/2;return {left,right:left+rw,width:rw};}
function drawCar(x,y,w,h,color,playerCar=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=playerCar?18:8;ctx.fillStyle=color;round(-w/2,-h/2,w,h,8);ctx.shadowBlur=0;ctx.fillStyle='#07101b';round(-w*.34,-h*.28,w*.68,h*.25,4);round(-w*.34,h*.05,w*.68,h*.22,4);ctx.fillStyle=playerCar?'#d8ffff':'#ffdfad';ctx.fillRect(-w*.38,-h*.48,w*.22,5);ctx.fillRect(w*.16,-h*.48,w*.22,5);ctx.fillStyle='#ff315b';ctx.fillRect(-w*.38,h*.42,w*.22,5);ctx.fillRect(w*.16,h*.42,w*.22,5);if(playerCar){ctx.fillStyle='#a7faff';ctx.fillRect(-w*.07,-h*.43,w*.14,h*.86)}ctx.restore();}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function background(dt){ctx.fillStyle='#050914';ctx.fillRect(0,0,W,H);let r=road(),horizon=H*.14;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1830');g.addColorStop(1,'#06101c');ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon);for(let i=0;i<22;i++){let x=(i*73+13)%W;let bh=12+(i*29)%55;ctx.fillStyle=i%3===0?'#153b55':'#101f38';ctx.fillRect(x,horizon-bh,18,bh)}
ctx.fillStyle='#101b2a';ctx.fillRect(r.left,0,r.width,H);ctx.fillStyle='#1c2b3d';ctx.fillRect(r.left+5,0,4,H);ctx.fillRect(r.right-9,0,4,H);
ctx.strokeStyle='#d6eaff';ctx.lineWidth=3;ctx.setLineDash([28,28]);ctx.lineDashOffset=-roadOffset;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(r.left+r.width*i/3,0);ctx.lineTo(r.left+r.width*i/3,H);ctx.stroke()}ctx.setLineDash([]);
let strip=roadOffset%54;for(let y=-54+strip;y<H;y+=54){ctx.fillStyle='#ff426e';ctx.fillRect(r.left-8,y,6,27);ctx.fillRect(r.right+2,y,6,27);ctx.fillStyle='#35eaff';ctx.fillRect(r.left-8,y+27,6,27);ctx.fillRect(r.right+2,y+27,6,27)}
}
function spawnCar(){const r=road(),ln=Math.floor(Math.random()*3),x=r.left+r.width*(ln+.5)/3;const colors=['#ff4e78','#ffc247','#6b7dff','#54e6a7','#b96aff'];traffic.push({x,y:-80,w:32+Math.random()*7,h:56+Math.random()*8,color:colors[Math.floor(Math.random()*colors.length)],speed:.55+Math.random()*.35,lane:ln});}
function update(dt){if(!playing)return;const factor=dt/16.67;const target=boost&&nitro>0?8.5:5.4;speed+=(target-speed)*.035*factor;dist+=speed*factor*.13;roadOffset+=speed*factor*1.7;nitro=Math.max(0,Math.min(100,nitro+(boost&&nitro>0?-0.65:0.14)*factor));player.x+=steer*5.8*factor;const r=road();player.x=Math.max(r.left+player.w*.65,Math.min(r.right-player.w*.65,player.x));spawn-=dt;if(spawn<=0){spawn=Math.max(340,950-dist*1.8);spawnCar();if(dist>180&&Math.random()<.3)spawnCar();}
for(const c of traffic){c.y+=(speed*1.7+c.speed*2.8)*factor;}
traffic=traffic.filter(c=>c.y<H+100);
for(const c of traffic){if(Math.abs(c.x-player.x)<(c.w+player.w)*.43&&Math.abs(c.y-player.y)<(c.h+player.h)*.42){crash();break}}
for(const p of particles){p.x+=p.vx*factor;p.y+=p.vy*factor;p.life-=factor;}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-.7*factor);flash=Math.max(0,flash-.04*factor);
$('distance').textContent=Math.floor(dist)+' m';$('speed').textContent=Math.floor(speed*24)+' km/h';$('nitroBar').style.width=nitro+'%';
}
function crash(){playing=false;over=true;shake=18;flash=1;for(let i=0;i<35;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:25+Math.random()*25,color:['#ff4a72','#ffd34d','#42eaff'][i%3]});if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.setItem('dopa_rush_best',best);$('best').textContent=best+' m'}$('headline').textContent='CRASH!';$('desc').textContent='Distance: '+Math.floor(dist)+' m • Best: '+best+' m';$('startBtn').textContent='RACE AGAIN';$('message').style.display='block';}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background(0);for(const c of traffic)drawCar(c.x,c.y,c.w,c.h,c.color,false);if(playing){drawCar(player.x,player.y,player.w,player.h,boost?'#f06aff':'#00eaff',true);if(boost){for(let i=0;i<3;i++){ctx.fillStyle='#8c4bff88';ctx.beginPath();ctx.moveTo(player.x-7+i*7,player.y+player.h/2);ctx.lineTo(player.x-4+i*7,player.y+player.h/2+22+Math.random()*18);ctx.lineTo(player.x+1+i*7,player.y+player.h/2);ctx.fill()}}}else if(!over){drawCar(W/2,H*.77,player.w,player.h,'#00eaff',true)}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2+Math.random()*3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(flash){ctx.fillStyle='rgba(255,60,90,'+(flash*.25)+')';ctx.fillRect(0,0,W,H)}ctx.restore();requestAnimationFrame(loop);}
function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw();}
function start(){traffic=[];particles=[];dist=0;speed=0;nitro=100;spawn=500;roadOffset=0;player.x=W/2;player.y=H*.77;steer=0;boost=false;playing=true;over=false;$('message').style.display='none';$('hint').style.opacity='1';}
$('startBtn').addEventListener('click',start);
function bind(id,val){const el=$(id);const down=e=>{e.preventDefault();steer=val;el.classList.add('active')};const up=e=>{e.preventDefault();if(steer===val)steer=0;el.classList.remove('active')};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
bind('left',-1);bind('right',1);const n=$('nitro');n.addEventListener('pointerdown',e=>{e.preventDefault();boost=true;n.classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(ev=>n.addEventListener(ev,e=>{boost=false;n.classList.remove('active')}));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key===' '||e.key==='Shift')boost=true;if(e.key==='Enter'&&!playing)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='ArrowRight'||e.key==='d')steer=0;if(e.key===' '||e.key==='Shift')boost=false});
let dragging=false;canvas.addEventListener('pointerdown',e=>{if(!playing)return;dragging=true;player.x=e.clientX});canvas.addEventListener('pointermove',e=>{if(dragging&&playing){const dx=e.clientX-player.x;player.x+=dx;player.x=Math.max(road().left+player.w/2,Math.min(road().right-player.w/2,player.x))}});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
requestAnimationFrame(loop);
})();
</script></body></html>

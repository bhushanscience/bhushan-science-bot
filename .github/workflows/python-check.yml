name: Python bot checks

on:
  push:
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/python-check.yml"
  pull_request:
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/python-check.yml"

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile bot.py
      - name: Import bot module
        env:
          BOT_TOKEN: ""
          OWNER_ID: "1"
        run: python -c "import bot; print('Bot module imported successfully')"

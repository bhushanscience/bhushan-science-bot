name: Build DOPA Racing APK
on:
  push:
    branches:
      - dopa-racing-3d
    paths:
      - 'dopa-racing/android/**'
      - '.github/workflows/build-dopa-racing-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build DOPA Racing APK
        working-directory: dopa-racing/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DOPA-Racing-APK
          path: dopa-racing/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
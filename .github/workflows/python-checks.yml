name: Python and Mini App checks

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q bot.py config.py tests
      - name: Validate Mini App JavaScript syntax
        run: node --check webapp/app.js
      - name: Validate config module
        run: python -c "import config; assert config.DB_FILE; assert config.TIMEZONE"
      - name: Run database and Mini App regression tests
        run: python -m unittest discover -s tests -v

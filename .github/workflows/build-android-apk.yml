name: Build Bhushan Science Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-app]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android platform files
        run: flutter create --platforms=android --project-name bhushan_science_app .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhushan-science-android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
